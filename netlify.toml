[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "20"

[functions]
directory = "netlify/functions"
included_files = ["education.html"]
node_bundler = "esbuild"

[dev]
publish = "dist"
port = 8888

[[redirects]]
from = "/api/portal-auth"
to = "/.netlify/functions/portal-auth"
status = 200
force = true

[[redirects]]
from = "/api/admin-auth"
to = "/.netlify/functions/admin-auth"
status = 200
force = true

[[redirects]]
from = "/api/games"
to = "/.netlify/functions/games"
status = 200
force = true

[[redirects]]
from = "/education.html"
to = "/.netlify/functions/education"
status = 200
force = true