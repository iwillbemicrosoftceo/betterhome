[build]
command = "npm run build"
publish = "dist"

[functions]
directory = "netlify/functions"
included_files = ["education.html"]

[dev]
publish = "dist"
port = 8888

[[redirects]]
from = "/api/auth"
to = "/.netlify/functions/auth"
status = 200
force = true

[[redirects]]
from = "/api/admin-auth"
to = "/.netlify/functions/admin-auth"
status = 200
force = true

[[redirects]]
from = "/education.html"
to = "/.netlify/functions/education"
status = 200
force = true