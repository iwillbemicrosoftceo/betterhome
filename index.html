<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Better Home | Game Join Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
    <div class="app-shell">
        <header class="hero">
            <p class="eyebrow">Fast classroom access</p>
            <h1>Join every game in seconds</h1>
            <p class="subhead">Enter your code and jump straight into the activity, without searching around for a link.</p>
        </header>

        <main class="join-list">
            <article class="join-card">
                <div class="platform">
                    <span class="platform-badge gimkit" aria-hidden="true"></span>
                    <div>
                        <h2>Gimkit</h2>
                        <p class="platform-copy">Live game code</p>
                    </div>
                </div>
                <div class="controls">
                    <label class="sr-only" for="gim">Gimkit join code</label>
                    <input type="text" id="gim" maxlength="6" inputmode="numeric" placeholder="Enter code">
                    <button id="gimjoin" type="button">Join</button>
                </div>
            </article>

            <article class="join-card">
                <div class="platform">
                    <span class="platform-badge kahoot" aria-hidden="true"></span>
                    <div>
                        <h2>Kahoot</h2>
                        <p class="platform-copy">Enter the PIN</p>
                    </div>
                </div>
                <div class="controls">
                    <label class="sr-only" for="koot">Kahoot join code</label>
                    <input type="text" id="koot" maxlength="7" inputmode="numeric" placeholder="Enter PIN">
                    <button id="kootjoin" type="button">Join</button>
                </div>
            </article>

            <article class="join-card">
                <div class="platform">
                    <span class="platform-badge nearpod" aria-hidden="true"></span>
                    <div>
                        <h2>Nearpod</h2>
                        <p class="platform-copy">Session access code</p>
                    </div>
                </div>
                <div class="controls">
                    <label class="sr-only" for="near">Nearpod join code</label>
                    <input type="text" id="near" maxlength="9" placeholder="Enter code">
                    <button id="nearjoin" type="button">Join</button>
                </div>
            </article>

            <article class="join-card">
                <div class="platform">
                    <span class="platform-badge blooket" aria-hidden="true"></span>
                    <div>
                        <h2>Blooket</h2>
                        <p class="platform-copy">Room ID</p>
                    </div>
                </div>
                <div class="controls">
                    <label class="sr-only" for="blook">Blooket join code</label>
                    <input type="text" id="blook" maxlength="7" inputmode="numeric" placeholder="Enter ID">
                    <button id="blookjoin" type="button">Join</button>
                </div>
            </article>
        </main>
    </div>

    <footer>
        Made by Krishna Murthy
    </footer>

    <script src="script.js"></script>
</body>
</html>
