<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Embed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #ruffle-container {
            width: min(100vw, 133.333vh);
            height: min(100vh, 75vw);
        }
        /* Include ruffle-object so Ruffle fills 100% of the 4:3 container */
        #ruffle-container object, 
        #ruffle-container embed, 
        #ruffle-container ruffle-object {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
    <!-- Ruffle CDN Script -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="ruffle-container">
       Javascript is disabled.
    </div>

    <script>
        const container = document.getElementById('ruffle-container');
        const urlParams = new URLSearchParams(window.location.search);
        
        // Use ?game=yourfile.swf, or fall back to happywheels.swf if no parameter is given
        const swfFile = urlParams.get('game');

        container.innerHTML = `
            <object width="100%" height="100%" data="${swfFile}">
                <param name="movie" value="${swfFile}">
                <param name="allowFullScreen" value="true">
            </object>
        `;
    </script>

</body>
</html>
