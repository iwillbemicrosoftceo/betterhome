<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruffle Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #ruffle-container {
            width: min(100vw, 133.333vh);
            height: min(100vh, 75vw);
        }
        #ruffle-container ruffle-player {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>

    <!-- 1. Configure Ruffle BEFORE loading the script -->
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            "polyfills": false,             // Skip scanning for <object>/<embed> tags
            "autoplay": "on",               // Start immediately without waiting
            "splashScreen": false,          // Skip the orange Ruffle splash delay
            "allowNetworking": "none",      // Stop Newgrounds API filter timeouts
            "openUrlMode": "deny",          // Block external URL calls
            "preferredRenderer": "webgl",   // Force Chromebook GPU acceleration
            "quality": "low"                // Speeds up heavy vector animations
        };
    </script>

    <!-- 2. Point to your local ruffle.js (or keep unpkg if you don't have the .wasm files) -->
    <script src="ruffle.js"></script>
</head>
<body>

    <div id="ruffle-container"></div>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("ruffle-container");
            const urlParams = new URLSearchParams(window.location.search);
            const swfFile = urlParams.get("game");

            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            container.appendChild(player);

            player.load({
                url: swfFile,
                allowScriptAccess: false
            });
        });
    </script>

</body>
</html>
