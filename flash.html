<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Ruffle Embed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
        }
        /* Make the Ruffle/object/embed container fill the screen */
        #ruffle-container, #ruffle-container object, #ruffle-container embed {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
    <!-- Ruffle CDN Script -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="ruffle-container">
        <!-- Standard embed or object tag pointing to your SWF file -->
        <object width="100%" height="100%" data="flash/happywheels.swf">
            <param name="movie" value="your-game.swf">
            <param name="allowFullScreen" value="true">
        </object>
    </div>

</body>
</html>
