<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Ruffle Embed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
        }
        /* Make the Ruffle/object/embed container fill the screen */
        #ruffle-container, #ruffle-container object, #ruffle-container embed {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
    <!-- Ruffle CDN Script -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        const container = document.getElementById('ruffle-container');
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        if (urlParams.has('name')) {
         const userName = urlParams.get('name');
         container.innerHTML = `
        <object width="100%" height="100%" data="${swfFile}">
        <param name="movie" value="${swfFile}">
        <param name="allowFullScreen" value="true">
        </object>`;
        }
    </script>
</head>
<body>

    <div id="ruffle-container">
       Javascript is disabled.
    </div>

</body>
</html>
