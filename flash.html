<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000; /* Black bars */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #ruffle-container {
            /* Strictly locks to 4:3 inside any viewport */
            width: min(100vw, 133.333vh);
            height: min(100vh, 75vw);
            position: relative;
        }
        #ruffle-container ruffle-player {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
    </style>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            letterbox: "on",
            allowFullscreen: true
        };
    </script>
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div id="ruffle-container"></div>

    <script>
        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-container");
            
            container.appendChild(player);

            const urlParams = new URLSearchParams(window.location.search);
            const swfFile = urlParams.get("game") || "happywheels.swf";

            player.load({
                url: swfFile
            });
        });
    </script>

</body>
</html>
