<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000; /* Black bars */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #ruffle-container {
            /* Strictly locks to 4:3 inside any viewport */
            width: min(100vw, 133.333vh);
            height: min(100vh, 75vw);
            position: relative;
        }
        #ruffle-container object, 
        #ruffle-container embed, 
        #ruffle-container ruffle-object {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
    </style>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            letterbox: "on"
        };
    </script>
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div id="ruffle-container"></div>

    <script>
        window.addEventListener("load", () => {
            const container = document.getElementById("ruffle-container");
            const urlParams = new URLSearchParams(window.location.search);
            const swfFile = urlParams.get("game");

            if (!swfFile) {
                container.innerHTML = '<p style="color:white; text-align:center; padding-top:20%;">No ?game= URL provided.</p>';
                return;
            }

            container.innerHTML = `
                <object data="${swfFile}">
                    <param name="movie" value="${swfFile}">
                    <param name="allowFullScreen" value="true">
                </object>
            `;
        });
    </script>

</body>
</html>
